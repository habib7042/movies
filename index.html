<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Secure Global Chat</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      background: #0f0f12; 
      color: #e5e5e7; 
      margin: 0; 
      padding: 0; 
      display: flex; 
      flex-direction: column; 
      height: 100vh;
      overflow: hidden;
    }
    
    /* Lockscreen Overlay */
    #lockScreen { 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      background: #121212; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      z-index: 1000; 
    }
    .pin-display { font-size: 2.5rem; letter-spacing: 10px; margin-bottom: 30px; height: 50px; color: #ff8c00; font-weight: bold; }
    .keypad { display: grid; grid-template-columns: repeat(3, 80px); gap: 20px; justify-content: center; }
    .key { 
      width: 80px; 
      height: 80px; 
      background: #222; 
      border: 1px solid #333; 
      border-radius: 50%; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 1.6rem; 
      font-weight: bold; 
      cursor: pointer; 
      user-select: none; 
    }
    .key:active { background: #ff8c00; color: #000; }

    /* Chat App Layout */
    #chatApp { 
      display: none; 
      flex-direction: column; 
      height: 100%; 
      width: 100%; 
      padding: 10px;
    }
    
    /* Dedicated Header Area for Fullscreen Controls */
    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 5px 12px 5px;
    }
    .header-title { font-weight: bold; color: #ff8c00; font-size: 1.1rem; }
    .fs-toggle-btn {
      background: #1c1c1f;
      border: 1px solid #2d2d34;
      color: #aaa;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    #chat { 
      flex: 1; 
      border: 1px solid #222; 
      padding: 12px; 
      overflow-y: auto; 
      margin-bottom: 8px; 
      border-radius: 16px; 
      background: #141416; 
      display: flex; 
      flex-direction: column; 
      gap: 14px; 
    }
    
    .msg-row { display: flex; gap: 8px; align-items: flex-end; max-width: 88%; position: relative; }
    .my-row { align-self: flex-end; flex-direction: row-reverse; }
    .peer-row { align-self: start; }
    
    .avatar { width: 34px; height: 34px; border-radius: 50%; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; background: #252529; flex-shrink: 0; }
    .msg-bubble { padding: 10px 14px; border-radius: 16px; font-size: 0.95rem; position: relative; background: #222226; box-shadow: 0 4px 10px rgba(0,0,0,0.2); word-break: break-word; }
    .my-row .msg-bubble { background: #007acc; color: #fff; }
    
    .username { font-weight: bold; font-size: 0.75rem; color: #ff8c00; margin-bottom: 4px; display: block; }
    .my-row .username { color: #b3dbff; }
    
    .reply-preview-box { background: rgba(0,0,0,0.2); border-left: 3px solid #ff8c00; padding: 4px 8px; margin-bottom: 6px; font-size: 0.8rem; border-radius: 4px; }
    .active-reply-bar { display: none; background: #222; padding: 10px 14px; border-radius: 8px; margin-bottom: 8px; justify-content: space-between; font-size: 0.85rem; align-items: center; }
    
    .chat-img-container { position: relative; margin-top: 6px; }
    .chat-img { max-width: 100%; max-height: 200px; border-radius: 10px; display: block; object-fit: contain; }
    .dl-btn { background: rgba(0,0,0,0.6); color: #fff; border: none; padding: 6px 10px; font-size: 0.75rem; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; margin-top: 6px; }
    
    .actions-tray { font-size: 0.75rem; display: flex; gap: 6px; margin-top: 5px; color: #aaa; cursor: pointer; user-select: none; padding: 2px 0; }
    .my-row .actions-tray { justify-content: flex-end; }
    
    .typing-box { height: 18px; font-size: 0.8rem; color: #8a8a8f; padding-left: 6px; font-style: italic; margin-bottom: 4px; }
    
    /* Interactive Mobile Input Area */
    .box { display: flex; gap: 8px; align-items: center; position: relative; background: #0f0f12; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 2px); }
    
    /* font-size: 16px explicitly stops iOS form fields from auto-zooming viewport */
    input[type="text"] { flex: 1; padding: 14px; border-radius: 14px; border: 1px solid #2d2d34; background: #1c1c1f; color: #fff; font-size: 16px; outline: none; min-width: 0; }
    
    .icon-btn { background: #1c1c1f; border: 1px solid #2d2d34; padding: 12px; border-radius: 14px; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; min-width: 46px; min-height: 46px; }
    .send-btn { padding: 14px 18px; border: none; background: #ff8c00; color: white; border-radius: 14px; font-weight: bold; font-size: 1rem; cursor: pointer; height: 46px; display: flex; align-items: center; }
    
    /* Mobile Responsive Grid for Emoji Tray */
    .emoji-tray { display: none; position: absolute; bottom: 65px; left: 0; width: 100%; background: #1c1c1f; border: 1px solid #2d2d34; border-radius: 12px; padding: 10px; grid-template-columns: repeat(4, 1fr); gap: 10px; z-index: 100; box-shadow: 0 -4px 15px rgba(0,0,0,0.5); }
    .emoji-item { font-size: 1.5rem; text-align: center; cursor: pointer; padding: 6px; }
  </style>
</head>
<body>

  <div id="lockScreen">
    <h3 style="color: #ff8c00; margin-bottom: 10px;">🔒 Chatroom Locked</h3>
    <div class="pin-display" id="dots"></div>
    <div class="keypad">
      <div class="key" onclick="pressPin(1)">1</div>
      <div class="key" onclick="pressPin(2)">2</div>
      <div class="key" onclick="pressPin(3)">3</div>
      <div class="key" onclick="pressPin(4)">4</div>
      <div class="key" onclick="pressPin(5)">5</div>
      <div class="key" onclick="pressPin(6)">6</div>
      <div class="key" onclick="pressPin(7)">7</div>
      <div class="key" onclick="pressPin(8)">8</div>
      <div class="key" onclick="pressPin(9)">9</div>
      <div class="key" style="background:transparent; border:none;" onclick="clearPin()">⌫</div>
      <div class="key" onclick="pressPin(0)">0</div>
    </div>
  </div>

  <div id="chatApp">
    <div class="chat-header">
      <span class="header-title">🔒 Encrypted Network</span>
      <button class="fs-toggle-btn" id="fsBtn" onclick="toggleFullscreen()">🖥️ Fullscreen</button>
    </div>

    <div id="chat"></div>
    <div class="typing-box" id="typingDisplay"></div>

    <div class="active-reply-bar" id="replyBar">
      <span id="replyBarText">Replying to...</span>
      <span style="color:#ff4545; cursor:pointer; font-weight:bold; padding: 5px 10px;" onclick="cancelReply()">✕</span>
    </div>

    <div class="emoji-tray" id="emojiTray">
      <div class="emoji-item" onclick="pickEmoji('😀')">😀</div>
      <div class="emoji-item" onclick="pickEmoji('😂')">😂</div>
      <div class="emoji-item" onclick="pickEmoji('😍')">😍</div>
      <div class="emoji-item" onclick="pickEmoji('👍')">👍</div>
      <div class="emoji-item" onclick="pickEmoji('🔥')">🔥</div>
      <div class="emoji-item" onclick="pickEmoji('❤️')">❤️</div>
      <div class="emoji-item" onclick="pickEmoji('👏')">👏</div>
      <div class="emoji-item" onclick="pickEmoji('🎉')">🎉</div>
    </div>

    <div class="box">
      <button class="icon-btn" onclick="toggleEmojiTray()">😀</button>
      <label class="icon-btn" for="imgInput">📷</label>
      <input type="file" id="imgInput" accept="image/*" style="display:none;" onchange="uploadImage(event)">
      <input type="text" id="msgInput" placeholder="Write a message..." autocomplete="off" oninput="notifyTyping(true)">
      <button class="send-btn" onclick="send()">Send</button>
    </div>
  </div>

  <script>
    // --- STATE MANAGEMENT ---
    const CORRECT_PIN = "1234"; // Adjust this pin to match your desired credentials
    let enteredPin = "";
    let socket = null;
    let replyId = null;
    let currentImageBase64 = null;
    
    let activeUser = "User_" + Math.floor(Math.random() * 1000); 
    let typingTimeout = null;

    // --- LOCKSCREEN PIN LOGIC ---
    function pressPin(num) {
      if (enteredPin.length < 4) {
        enteredPin += num;
        document.getElementById("dots").textContent = "*".repeat(enteredPin.length);
      }
      if (enteredPin.length === 4) {
        setTimeout(() => {
          if (enteredPin === CORRECT_PIN) {
            document.getElementById("lockScreen").style.display = "none";
            document.getElementById("chatApp").style.display = "flex";
            
            // Try triggering dynamic fullscreen layout immediately upon entering chat
            requestAutofullscreen();
            initWebSocket(); 
          } else {
            alert("Incorrect PIN!");
            clearPin();
          }
        }, 250);
      }
    }

    function clearPin() {
      enteredPin = "";
      document.getElementById("dots").textContent = "";
    }

    // --- FULLSCREEN CONTROLS ---
    function requestAutofullscreen() {
      // Browsers usually require direct user clicks, but running it directly here works right off the PIN pad tap
      const docEl = document.documentElement;
      if (docEl.requestFullscreen) docEl.requestFullscreen().catch(() => {});
    }

    function toggleFullscreen() {
      const btn = document.getElementById("fsBtn");
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen()
          .then(() => { btn.textContent = "Exit Full"; })
          .catch(err => console.log(err));
      } else {
        document.exitFullscreen();
        btn.textContent = "🖥️ Fullscreen";
      }
    }

    // Update screen button state if full-screen mode changes manually via native shortcuts
    document.addEventListener('fullscreenchange', () => {
      const btn = document.getElementById("fsBtn");
      if (document.fullscreenElement) {
        btn.textContent = "Exit Full";
      } else {
        btn.textContent = "🖥️ Fullscreen";
      }
    });

    // --- WEBSOCKET ENGINE ---
    function initWebSocket() {
      const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      const wsUrl = `${protocol}//${window.location.host}/api/chat`;

      socket = new WebSocket(wsUrl);

      socket.addEventListener("open", () => {
        console.log("⚡ Connected instantly via real-time WebSocket.");
      });

      socket.addEventListener("message", (event) => {
        try {
          const data = JSON.parse(event.data);
          handleIncomingData(data);
        } catch (err) {
          console.error("Failed parsing message packet:", err);
        }
      });

      socket.addEventListener("close", () => {
        console.warn("⚠️ Connection closed. Attempting reconnect in 3s...");
        setTimeout(initWebSocket, 3000); 
      });
    }

    function handleIncomingData(data) {
      if (data.type === "chat_msg") {
        renderMessage(data);
      } else if (data.type === "typing") {
        const display = document.getElementById("typingDisplay");
        if (data.user !== activeUser) {
          display.textContent = data.isTyping ? `${data.user} is typing...` : "";
        }
      }
    }

    // --- UI RENDERING ENGINE ---
    function renderMessage(msg) {
      const chatContainer = document.getElementById("chat");
      const isMe = msg.user === activeUser;

      const row = document.createElement("div");
      row.className = `msg-row ${isMe ? "my-row" : "peer-row"}`;
      row.id = `msg-${msg.id}`;

      let innerHTML = `
        <div class="avatar">${msg.user.substring(0, 2).toUpperCase()}</div>
        <div class="msg-bubble">
          <span class="username">${msg.user}</span>
      `;

      if (msg.replyTo) {
        innerHTML += `<div class="reply-preview-box"><i>Replying to:</i> ${escapeHTML(msg.replyToText)}</div>`;
      }

      if (msg.text) {
        innerHTML += `<div>${escapeHTML(msg.text)}</div>`;
      }

      if (msg.image) {
        innerHTML += `
          <div class="chat-img-container">
            <img src="${msg.image}" class="chat-img" alt="shared content" />
            <a href="${msg.image}" download="shared_image.png" class="dl-btn">💾 Save</a>
          </div>
        `;
      }

      innerHTML += `
          <div class="actions-tray" onclick="triggerReply('${msg.id}', '${escapeHTML(msg.text || "Image")}')">
            ⤺ Reply
          </div>
        </div>
      `;

      row.innerHTML = innerHTML;
      chatContainer.appendChild(row);
      
      // Keep mobile users glued smoothly to bottom messages
      setTimeout(() => {
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }, 50);
    }

    // --- OUTBOUND SENDER ---
    function send() {
      const input = document.getElementById("msgInput");
      const text = input.value.trim();
      
      if (!text && !currentImageBase64) return;

      const payload = {
        type: "chat_msg",
        id: "msg_" + Date.now() + "_" + Math.floor(Math.random() * 1000),
        user: activeUser,
        text: text,
        image: currentImageBase64 || null,
        replyTo: replyId,
        replyToText: replyId ? document.getElementById("replyBarText").dataset.rawText : null
      };

      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify(payload));
        
        input.value = "";
        cancelReply();
        currentImageBase64 = null;
        notifyTyping(false);
      } else {
        alert("Socket connection is currently down. Reconnecting...");
      }
    }

    // --- MEDIA UPLOADER ---
    function uploadImage(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        currentImageBase64 = e.target.result;
        send(); 
      };
      reader.readAsDataURL(file);
    }

    // --- TYPING INDICATORS ---
    function notifyTyping(isTyping) {
      if (!socket || socket.readyState !== WebSocket.OPEN) return;
      
      socket.send(JSON.stringify({
        type: "typing",
        user: activeUser,
        isTyping: isTyping
      }));

      if (isTyping) {
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => notifyTyping(false), 2000);
      }
    }

    // --- AUXILIARY HELPERS ---
    function triggerReply(id, text) {
      replyId = id;
      const bar = document.getElementById("replyBar");
      const txt = document.getElementById("replyBarText");
      txt.textContent = `Replying to: "${text.substring(0, 18)}..."`;
      txt.dataset.rawText = text; 
      bar.style.display = "flex";
    }

    function cancelReply() {
      replyId = null;
      document.getElementById("replyBar").style.display = "none";
    }

    function toggleEmojiTray() {
      const tray = document.getElementById("emojiTray");
      tray.style.display = tray.style.display === "grid" ? "none" : "grid";
    }

    function pickEmoji(emoji) {
      const input = document.getElementById("msgInput");
      input.value += emoji;
      toggleEmojiTray();
      input.focus();
    }

    function escapeHTML(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    document.getElementById("msgInput").addEventListener("keydown", function(e) {
      if (e.key === "Enter") send();
    });
  </script>
</body>
</html>
