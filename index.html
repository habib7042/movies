<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Secure Global Chat</title>
        <style>
            * { box-sizing: border-box; }
                body { font-family: system-ui, -apple-system, sans-serif; background: #0f0f12; color: #e5e5e7; margin: 0; padding: 10px; display: flex; flex-direction: column; height: 100vh; }
                    
                        /* Lockscreen Overlay */
                            #lockScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #121212; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
                                .pin-display { font-size: 2.5rem; letter-spacing: 10px; margin-bottom: 30px; height: 50px; color: #ff8c00; font-weight: bold; }
                                    .keypad { display: grid; grid-template-columns: repeat(3, 80px); gap: 15px; justify-content: center; }
                                        .key { width: 80px; height: 80px; background: #222; border: 1px solid #333; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold; cursor: pointer; user-select: none; }
                                            .key:active { background: #ff8c00; color: #000; }

                                                /* Chat App Layout */
                                                    #chatApp { display: none; flex-direction: column; height: 100%; width: 100%; }
                                                        #chat { flex: 1; border: 1px solid #222; padding: 15px; overflow-y: auto; margin-bottom: 10px; border-radius: 16px; background: #141416; display: flex; flex-direction: column; gap: 14px; }
                                                            .msg-row { display: flex; gap: 8px; align-items: flex-end; max-width: 85%; position: relative; }
                                                                .my-row { align-self: flex-end; flex-direction: row-reverse; }
                                                                    .peer-row { align-self: start; }
                                                                        .avatar { width: 36px; height: 36px; border-radius: 50%; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; background: #252529; }
                                                                            .msg-bubble { padding: 10px 14px; border-radius: 16px; font-size: 0.95rem; position: relative; background: #222226; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
                                                                                .my-row .msg-bubble { background: #007acc; color: #fff; }
                                                                                    .username { font-weight: bold; font-size: 0.75rem; color: #ff8c00; margin-bottom: 4px; display: block; }
                                                                                        .my-row .username { color: #b3dbff; }
                                                                                            .reply-preview-box { background: rgba(0,0,0,0.2); border-left: 3px solid #ff8c00; padding: 4px 8px; margin-bottom: 6px; font-size: 0.8rem; border-radius: 4px; }
                                                                                                .active-reply-bar { display: none; background: #222; padding: 8px 12px; border-radius: 8px; margin-bottom: 6px; justify-content: space-between; font-size: 0.85rem; }
                                                                                                    .chat-img-container { position: relative; margin-top: 6px; }
                                                                                                        .chat-img { max-width: 100%; max-height: 220px; border-radius: 10px; display: block; }
                                                                                                            .dl-btn { background: rgba(0,0,0,0.6); color: #fff; border: none; padding: 4px 8px; font-size: 0.75rem; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; margin-top: 4px; }
                                                                                                                .actions-tray { font-size: 0.75rem; display: flex; gap: 6px; margin-top: 3px; color: #aaa; cursor: pointer; user-select: none; }
                                                                                                                    .my-row .actions-tray { justify-content: flex-end; }
                                                                                                                        .reactions-row { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
                                                                                                                            .react-pill { background: #2a2a30; padding: 2px 6px; border-radius: 10px; font-size: 0.75rem; display: flex; gap: 2px; align-items: center; }
                                                                                                                                .typing-box { height: 18px; font-size: 0.8rem; color: #8a8a8f; padding-left: 10px; font-style: italic; }
                                                                                                                                    .box { display: flex; gap: 8px; align-items: center; position: relative; }
                                                                                                                                        input[type="text"] { flex: 1; padding: 14px; border-radius: 12px; border: 1px solid #2d2d34; background: #1c1c1f; color: #fff; font-size: 1rem; outline: none; }
                                                                                                                                            .icon-btn { background: #1c1c1f; border: 1px solid #2d2d34; padding: 12px; border-radius: 12px; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; }
                                                                                                                                                .send-btn { padding: 14px 20px; border: none; background: #ff8c00; color: white; border-radius: 12px; font-weight: bold; font-size: 1rem; }
                                                                                                                                                    .emoji-tray { display: none; position: absolute; bottom: 60px; left: 10px; background: #222; border: 1px solid #444; border-radius: 8px; padding: 8px; grid-template-columns: repeat(4, 45px); gap: 5px; z-index: 100; }
                                                                                                                                                        .emoji-item { font-size: 1.3rem; text-align: center; cursor: pointer; padding: 3px; }
                                                                                                                                                          </style>
                                                                                                                                                          </head>
                                                                                                                                                          <body>

                                                                                                                                                            <div id="lockScreen">
                                                                                                                                                                <h3 style="color: #ff8c00;">🔒 Chatroom Locked</h3>
                                                                                                                                                                    <div class="pin-display" id="dots"></div>
                                                                                                                                                                        <div class="keypad">
                                                                                                                                                                              <div class="key" onclick="pressPin(1)">1</div>
                                                                                                                                                                                    <div class="key" onclick="pressPin(2)">2</div>
                                                                                                                                                                                          <div class="key" onclick="pressPin(3)">3</div>
                                                                                                                                                                                                <div class="key" onclick="pressPin(4)">4</div>
                                                                                                                                                                                                      <div class="key" onclick="pressPin(5)">5</div>
                                                                                                                                                                                                            <div class="key" onclick="pressPin(6)">6</div>
                                                                                                                                                                                                                  <div class="key" onclick="pressPin(7)">7</div>
                                                                                                                                                                                                                        <div class="key" onclick="pressPin(8)">8</div>
                                                                                                                                                                                                                              <div class="key" onclick="pressPin(9)">9</div>
                                                                                                                                                                                                                                    <div class="key" style="background:transparent; border:none;" onclick="clearPin()">⌫</div>
                                                                                                                                                                                                                                          <div class="key" onclick="pressPin(0)">0</div>
                                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                  <div id="chatApp">
                                                                                                                                                                                                                                                      <div id="chat"></div>
                                                                                                                                                                                                                                                          <div class="typing-box" id="typingDisplay"></div>

                                                                                                                                                                                                                                                              <div class="active-reply-bar" id="replyBar">
                                                                                                                                                                                                                                                                    <span id="replyBarText">Replying to...</span>
                                                                                                                                                                                                                                                                          <span style="color:red; cursor:pointer; font-weight:bold;" onclick="cancelReply()">X</span>
                                                                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                                                                  <div class="emoji-tray" id="emojiTray">
                                                                                                                                                                                                                                                                                        <div class="emoji-item" onclick="pickEmoji('😀')">😀</div>
                                                                                                                                                                                                                                                                                              <div class="emoji-item" onclick="pickEmoji('😂')">😂</div>
                                                                                                                                                                                                                                                                                                    <div class="emoji-item" onclick="pickEmoji('😍')">😍</div>
                                                                                                                                                                                                                                                                                                          <div class="emoji-item" onclick="pickEmoji('👍')">👍</div>
                                                                                                                                                                                                                                                                                                                <div class="emoji-item" onclick="pickEmoji('🔥')">🔥</div>
                                                                                                                                                                                                                                                                                                                      <div class="emoji-item" onclick="pickEmoji('❤️')">❤️</div>
                                                                                                                                                                                                                                                                                                                            <div class="emoji-item" onclick="pickEmoji('👏')">👏</div>
                                                                                                                                                                                                                                                                                                                                  <div class="emoji-item" onclick="pickEmoji('🎉')">🎉</div>
                                                                                                                                                                                                                                                                                                                                      </div>

                                                                                                                                                                                                                                                                                                                                          <div class="box">
                                                                                                                                                                                                                                                                                                                                                <button class="icon-btn" onclick="toggleEmojiTray()">😀</button>
                                                                                                                                                                                                                                                                                                                                                      <label class="icon-btn" for="imgInput">📷</label>
                                                                                                                                                                                                                                                                                                                                                            <input type="file" id="imgInput" accept="image/*" style="display:none;" onchange="uploadImage(event)">
                                                                                                                                                                                                                                                                                                                                                                  <input type="text" id="msgInput" placeholder="Write a message..." autocomplete="off" oninput="notifyTyping(true)">
                                                                                                                                                                                                                                                                                                                                                                        <button class="send-btn" onclick="send()">Send</button>
                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                                                                                                                                                                <script>
                                                                                                                                                                                                                                                                                                                                                                                    let currentPin = "";
                                                                                                                                                                                                                                                                                                                                                                                        const CORRECT_PIN = "7042";

                                                                                                                                                                                                                                                                                                                                                                                            // Security triggers to lock screen on switch/reload
                                                                                                                                                                                                                                                                                                                                                                                                document.addEventListener("visibilitychange", () => { if (document.hidden) lockChat(); });
                                                                                                                                                                                                                                                                                                                                                                                                    window.addEventListener("beforeunload", () => { lockChat(); });

                                                                                                                                                                                                                                                                                                                                                                                                        function pressPin(num) {
                                                                                                                                                                                                                                                                                                                                                                                                              if (currentPin.length >= 4) return;
                                                                                                                                                                                                                                                                                                                                                                                                                    currentPin += num;
                                                                                                                                                                                                                                                                                                                                                                                                                          document.getElementById("dots").innerText = "*".repeat(currentPin.length);
                                                                                                                                                                                                                                                                                                                                                                                                                                if (currentPin.length === 4) {
                                                                                                                                                                                                                                                                                                                                                                                                                                        if (currentPin === CORRECT_PIN) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                  sessionStorage.setItem("room_auth", "true");
                                                                                                                                                                                                                                                                                                                                                                                                                                                            initChatApp();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              alert("Wrong PIN!");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        clearPin();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              function clearPin() { currentPin = ""; document.getElementById("dots").innerText = ""; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      function lockChat() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            sessionStorage.removeItem("room_auth");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById("lockScreen").style.display = "flex";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("chatApp").style.display = "none";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              clearPin();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      // --- CHAT LOGIC ---
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const chat = document.getElementById("chat");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const input = document.getElementById("msgInput");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const replyBar = document.getElementById("replyBar");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const replyBarText = document.getElementById("replyBarText");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const emojiTray = document.getElementById("emojiTray");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              let currentMessages = [];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  let targetReplyId = null;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      let isTypingState = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          let typingTimeout = null;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              let username = localStorage.getItem("u_name");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  let userAvatar = localStorage.getItem("u_avatar");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      function initChatApp() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (sessionStorage.getItem("room_auth") !== "true") return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById("lockScreen").style.display = "none";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("chatApp").style.display = "flex";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const avatars = ["🦊","🐱","🐼","🐯","🐸","🐨","🦁","🤖"];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (!username) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            username = prompt("Choose a display name:") || "Guest_" + Math.floor(Math.random()*1000);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    userAvatar = avatars[Math.floor(Math.random() * avatars.length)];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            localStorage.setItem("u_name", username);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    localStorage.setItem("u_avatar", userAvatar);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                setInterval(sync, 800);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      sync();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              function toggleEmojiTray() { emojiTray.style.display = emojiTray.style.display === "grid" ? "none" : "grid"; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  function pickEmoji(e) { input.value += e; toggleEmojiTray(); input.focus(); }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      function setReplyTarget(msgId, userTag) { targetReplyId = msgId; replyBarText.innerText = "Replying to @" + userTag; replyBar.style.display = "flex"; input.focus(); }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          function cancelReply() { targetReplyId = null; replyBar.style.display = "none"; }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              async function notifyTyping(status) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (status && !isTypingState) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            isTypingState = true;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    await fetch("/api/typing", { method: "POST", body: JSON.stringify({ user: username, isTyping: true }) });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                clearTimeout(typingTimeout);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      typingTimeout = setTimeout(async () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              isTypingState = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      await fetch("/api/typing", { method: "POST", body: JSON.stringify({ user: username, isTyping: false }) });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }, 2000);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function uploadImage(e) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const file = e.target.files[0];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if(!file) return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const reader = new FileReader();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            reader.onload = function(evt) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const img = new Image();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            img.onload = function() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const canvas = document.createElement("canvas");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const max_size = 400;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          let w = img.width, h = img.height;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (w > h) { if(w > max_size){ h *= max_size/w; w = max_size; } }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              else { if(h > max_size){ w *= max_size/h; h = max_size; } }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        canvas.width = w; canvas.height = h;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  canvas.getContext("2d").drawImage(img, 0, 0, w, h);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            send(canvas.toDataURL("image/jpeg", 0.5));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            img.src = evt.target.result;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        reader.readAsDataURL(file);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
